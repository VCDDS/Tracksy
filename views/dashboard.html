<script>
const content = document.getElementById("content");

let currentUser = localStorage.getItem("username") || "Gast";
let isAdmin = localStorage.getItem("isAdmin") === "true";

function updateDateTime(){

let now = new Date();

let date = now.toLocaleDateString("de-DE");
let time = now.toLocaleTimeString("de-DE");

document.getElementById("datetime").textContent =
    "📅 " + date + " 🕒 " + time;
}

setInterval(updateDateTime, 1000);

updateDateTime();

if(!isAdmin){
    document.getElementById("adminMenu").style.display = "none";
}

if(isCustomer){
    document.getElementById("adminMenu").style.display = "none";

    document.querySelectorAll(".nav-left button").forEach(btn => {
        let text = btn.innerText;

        if(
            !text.includes("Start") &&
            !text.includes("Report") &&
            !text.includes("Vorschläge") &&
            !text.includes("Nachrichten") &&
            !text.includes("Benutzer")
        ){
            btn.style.display = "none";
        }

}

async function apiGet(url){
    let res = await fetch(url);
    return await res.json();
}

async function apiPost(url, data){
    let res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    return await res.text();
}

function parseGermanDate(str){
    if(!str) return null;

    let parts = str.split(", ");
    let dateParts = parts[0].split(".");
    let timeParts = (parts[1] || "00:00:00").split(":");

    return new Date(
        parseInt(dateParts[2]),
        parseInt(dateParts[1]) - 1,
        parseInt(dateParts[0]),
        parseInt(timeParts[0] || 0),
        parseInt(timeParts[1] || 0),
        parseInt(timeParts[2] || 0)
    );
}

function getDateValue(str){
    let d = parseGermanDate(str);
    return d ? d.getTime() : 0;
}

function toggleMobileMenu(){
    const menu = document.getElementById("mobileMenu");

    if(!menu){
        return;
    }

    menu.classList.toggle("mobile-menu-open");
}

function toggleMobileAdminMenu(){
    const menu = document.getElementById("mobileAdminMenu");

    if(!menu){
        return;
    }

    menu.classList.toggle("mobile-admin-menu-open");
}

document.addEventListener("click", function(e){
    if(window.innerWidth > 768) return;

    let x = e.clientX;
    let y = e.clientY;

    if(x < 70 && y < 80){

});

    if(!t.start_time || !t.stop_time) return;

    let start = parseGermanDate(t.start_time);

    let totalMinutes = Math.floor((stop - start) / 1000 / 60);

    let workMinutes = totalMinutes - pauseMinutes;

    if(workMinutes < 0) workMinutes = 0;

    let project = t.project || "Ohne Projekt";

    if(!projects[project]){
        projects[project] = {
            work: 0,
            pause: 0,
            tasks: {}
        };
    }

    if(!projects[project].tasks[task]){
        projects[project].tasks[task] = {
            work: 0,

function filterTickets(){

let searchInput = document.getElementById("ticketSearch");
let statusInput = document.getElementById("ticketStatusFilter");
let priorityInput = document.getElementById("ticketPriorityFilter");

if(!searchInput || !statusInput || !priorityInput){
    return;
}

let search = searchInput.value.toLowerCase().trim();
let status = statusInput.value.toLowerCase();
let priority = priorityInput.value.toLowerCase();

let cards = document.querySelectorAll(".tracksy-ticket-card");

let visibleCount = 0;

cards.forEach(card => {

    let title = card.dataset.title || "";
    let project = card.dataset.project || "";
    let customer = card.dataset.customer || "";
    let cardStatus = card.dataset.status || "";
    let cardPriority = card.dataset.priority || "";

    let matchesSearch =
        !search ||
        title.includes(search) ||
        project.includes(search) ||
        customer.includes(search);

    let matchesStatus =
        !status ||
        cardStatus.includes(status);

    let matchesPriority =
        !priority ||
        cardPriority === priority;

    let visible =
        matchesSearch &&
        matchesStatus &&
        matchesPriority;

    card.style.display = visible ? "" : "none";

    if(visible){
        visibleCount++;
    }
});

let emptyState = document.getElementById("ticketEmptyState");

if(emptyState){
    emptyState.style.display =
        visibleCount === 0 ? "block" : "none";
}
}

function resetTicketFilters(){

let search = document.getElementById("ticketSearch");
let status = document.getElementById("ticketStatusFilter");
let priority = document.getElementById("ticketPriorityFilter");

if(search) search.value = "";
if(status) status.value = "";
if(priority) priority.value = "";

filterTickets();
}

function updateCalendarSelect(){

function changeCalendarMonth(direction){

window.selectedMonth += direction;

if(window.selectedMonth < 0){
    window.selectedMonth = 11;
    window.selectedYear--;
}

if(window.selectedMonth > 11){
    window.selectedMonth = 0;
    window.selectedYear++;
}

loadPage("kalender");
}

async function checkNewSuggestions(){

let suggestions = await apiGet("/suggestions");

let lastSeen = localStorage.getItem("lastSuggestionSeen") || "0";

let hasNew = suggestions.some(s => {

    let suggestionNew = getDateValue(s.created_at) > parseInt(lastSeen);

    let commentNew = (s.comments || []).some(c =>
        getDateValue(c.created_at) > parseInt(lastSeen)
    );

    return suggestionNew || commentNew;
});

let badge = document.getElementById("suggestionBadge");

if(badge){
    badge.style.display = hasNew ? "inline-block" : "none";
}
}

async function markSuggestionsSeen(){

let suggestions = await apiGet("/suggestions");

let allDates = [];

suggestions.forEach(s => {
    allDates.push(getDateValue(s.created_at));

    (s.comments || []).forEach(c => {
        allDates.push(getDateValue(c.created_at));
    });
});

if(allDates.length > 0){
    let newest = allDates.sort((a,b) => b-a)[0];
    localStorage.setItem("lastSuggestionSeen", newest);
}

let badge = document.getElementById("suggestionBadge");

if(badge){
    badge.style.display = "none";
}
}
